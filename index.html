*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--ui);-webkit-tap-highlight-color:transparent}
button{font:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid #fff;outline-offset:2px}
button:disabled{cursor:not-allowed}
[hidden]{display:none!important}

.screen{min-height:100vh;min-height:100dvh;width:100%;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;background-size:cover;background-position:center}
.back{position:absolute;top:14px;left:14px}
.btn{border:2px solid #000;border-radius:6px;padding:10px 18px;font-weight:800;font-style:italic;color:#fff;background:var(--pink);box-shadow:0 4px 0 rgba(0,0,0,.55);transition:transform .08s,box-shadow .08s,filter .15s}
.btn:hover:not(:disabled){filter:brightness(1.12)}
.btn:active:not(:disabled){transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.55)}
.btn:disabled{filter:grayscale(.8) brightness(.6)}
.btn.pink{background:var(--pink);color:#000}
.btn.green{background:#044525}

/* ---------- MENÚ ---------- */
#menu{background-image:linear-gradient(90deg,rgba(5,2,20,.0),rgba(5,2,20,.0)),var(--img-menu)}
.menu-grid{width:min(1000px,100%);display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center}
.logo{text-align:center;font-family:var(--display);text-transform:uppercase;line-height:1}
.logo .big{display:block;font-size:clamp(44px,8vw,84px);color:#fff;text-shadow:-6px 3px 0 #e00,6px -3px 0 #22f,0 0 30px rgba(0,0,0,.6)}
.logo .sub{display:block;margin-top:14px;font-size:clamp(40px,7vw,72px);font-family:'Tahoma',var(--ui);font-weight:900;color:#fff;text-shadow:0 3px 14px rgba(0,0,0,.8)}
.menu-btns{display:flex;flex-direction:column;gap:16px}
.menu-btns .btn{font-family:var(--display);font-style:normal;font-size:clamp(18px,3.4vw,24px);padding:16px 10px;color:#000;border-radius:3px;text-transform:uppercase;letter-spacing:.02em}
.btn.m-pen{background:#3300ff;color:#fff}
.btn.m-ttt{background:#ffff33}
.btn.m-wor{background:#33ff33}
.btn.m-out{background:#cc0000;color:#000}
@media(max-width:720px){.menu-grid{grid-template-columns:1fr;gap:22px}.menu-btns{max-width:340px;width:100%;margin:0 auto}}

/* ---------- TRES EN RAYA ---------- */
#ttt-setup{background-image:var(--img-ttt)}
#ttt-board{background-image:var(--img-board)}
.panel{width:min(440px,100%);padding:26px 24px 28px;border-radius:14px;background:rgba(10,4,40,.62);backdrop-filter:blur(3px);border:1px solid rgba(255,255,255,.18);text-align:left}
.ttt-title{font-family:var(--display);font-size:clamp(26px,6vw,34px);text-align:center;margin:0 0 6px;color:#ff33ff;text-shadow:3px 3px 0 #3300ff;text-transform:uppercase}
.hint{display:block;width:fit-content;margin:0 auto 18px;background:var(--pink);color:#000;font-size:13px;font-style:italic;font-weight:600;padding:4px 12px;border-radius:3px}
.field{display:block;margin-top:12px;font-weight:600;font-style:italic;font-size:14px}
.field input{display:block;width:100%;margin-top:6px;padding:10px 12px;border-radius:4px;border:1px solid #888;font:inherit;background:#fff;color:#111}
.panel .btn.go{display:block;margin:22px auto 0;min-width:190px;padding:12px 18px}

#ttt-board .estado{font-family:'Segoe UI Black',var(--display);font-size:clamp(20px,5vw,28px);text-align:center;margin:0 0 16px;text-shadow:0 2px 10px #000,0 0 3px #000;min-height:1.3em}
.board{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:min(360px,86vw);aspect-ratio:1}
.cell{border:2px solid rgba(255,255,255,.35);border-radius:10px;background:rgba(10,4,40,.55);color:#fff;font-family:var(--display);font-size:clamp(38px,12vw,64px);line-height:1;display:grid;place-items:center;transition:background .15s,transform .1s}
.cell:hover:not(:disabled){background:rgba(80,40,200,.55)}
.cell:disabled{cursor:default}
.cell.X{color:#ff5cff;text-shadow:0 0 14px #ff33ff}
.cell.O{color:#5ce8ff;text-shadow:0 0 14px #33e0ff}
.cell.win{background:rgba(255,255,51,.28);border-color:#ffff33;animation:pop .5s ease}
@keyframes pop{50%{transform:scale(1.08)}}
.row-btns{display:flex;gap:14px;margin-top:20px}

/* ---------- PENALES ---------- */
#penales{background:var(--pitch);justify-content:flex-start;padding-top:12px}
.pwrap{width:min(900px,100%)}
.ptop{display:flex;align-items:center;gap:10px;padding:4px 2px 10px;font-style:italic}
.ptop .back{position:static}
.ptop .goles,.ptop .intentos{font-size:clamp(15px,2.8vw,20px);font-weight:700;white-space:nowrap}
.ptop .msg{flex:1;text-align:center;font-size:clamp(17px,3.4vw,26px);font-weight:800;min-height:1.3em}
.pstage{position:relative;width:100%;aspect-ratio:760/479;background:var(--img-arco) center/100% 100% no-repeat;border-radius:12px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.keeper{position:absolute;left:50%;bottom:23%;width:27%;transform:translateX(-50%);transition:transform .38s cubic-bezier(.2,.8,.3,1);pointer-events:none;user-select:none}
.keeper.dive{width:36%}
.ball{position:absolute;left:50%;top:87%;width:6.2%;transform:translate(-50%,-50%) scale(1) rotate(0);transition:left .5s cubic-bezier(.3,.6,.4,1),top .5s cubic-bezier(.3,.6,.4,1),transform .5s linear;pointer-events:none;user-select:none}
.pctl{display:grid;grid-template-columns:repeat(3,1fr) auto;gap:12px;margin-top:16px}
.pctl .btn{background:var(--pitch);border-color:#0a8a4a;padding:14px 10px;font-size:clamp(15px,3vw,18px);box-shadow:0 4px 0 rgba(0,0,0,.45)}
.pctl .btn.reset{background:#0b6b3a}
@media(max-width:560px){.pctl{grid-template-columns:1fr 1fr 1fr}.pctl .reset{grid-column:1/-1}}

/* ---------- ADIVINA (WORDLE) ---------- */
#wordle{background-image:var(--img-letras);justify-content:flex-start;padding-top:12px}
.wwrap{width:min(500px,100%);display:flex;flex-direction:column;align-items:center}
.wtop{display:flex;align-items:center;justify-content:space-between;width:100%;gap:8px}
.wtop .back{position:static}
.wtop h2{margin:0;font-family:var(--display);font-size:clamp(20px,5vw,28px);letter-spacing:.12em;text-shadow:0 0 12px #3355ff}
.wtop .btn{padding:8px 12px;font-size:13px;background:#1a3fbf}
.wmsg{min-height:1.6em;margin:12px 0 8px;font-weight:700;font-size:18px;text-align:center;text-shadow:0 1px 6px #000}
.grid{display:grid;grid-template-rows:repeat(6,1fr);gap:6px;width:min(330px,80vw)}
.grow{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.tile{aspect-ratio:1;border:2px solid rgba(255,255,255,.28);background:rgba(8,12,50,.55);display:grid;place-items:center;font-weight:800;font-size:clamp(24px,7vw,32px);text-transform:uppercase;border-radius:4px;user-select:none}
.tile.filled{border-color:rgba(255,255,255,.75);animation:bump .12s ease}
.tile[data-s="2"]{background:#538d4e;border-color:#538d4e}
.tile[data-s="1"]{background:#b59f3b;border-color:#b59f3b}
.tile[data-s="0"]{background:#3a3a3c;border-color:#3a3a3c}
.tile.flip{animation:flip .5s ease}
@keyframes flip{50%{transform:rotateX(90deg)}}
@keyframes bump{50%{transform:scale(1.1)}}
.grow.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
.kb{margin-top:18px;width:100%;display:flex;flex-direction:column;gap:7px}
.kr{display:flex;justify-content:center;gap:5px}
.key{flex:1 1 0;max-width:44px;height:50px;border:0;border-radius:5px;background:#6d7aa8;color:#fff;font-weight:700;font-size:15px;padding:0;transition:background .2s}
.key.wide{flex:1.6 1 0;max-width:72px;font-size:11px}
.key:active{filter:brightness(1.2)}
.key[data-s="2"]{background:#538d4e}
.key[data-s="1"]{background:#b59f3b}
.key[data-s="0"]{background:#3a3a3c;color:#999}
.wnew{margin-top:16px;background:#1a3fbf;padding:12px 22px}
.wnew.pulse{animation:glow 1s infinite alternate}
@keyframes glow{to{box-shadow:0 0 0 4px rgba(255,255,255,.7),0 4px 0 rgba(0,0,0,.55)}}

/* ---------- SALIR ---------- */
#bye{background:radial-gradient(circle at 50% 40%,#2a0a5e,#0a0420 70%);text-align:center;gap:20px}
#bye h2{font-family:var(--display);font-size:clamp(30px,8vw,56px);margin:0;text-shadow:-4px 2px 0 #e00,4px -2px 0 #22f}
#bye p{margin:0;color:var(--muted)}

/* ---------- DIÁLOGO ---------- */
dialog{border:2px solid #000;border-radius:10px;padding:0;min-width:min(340px,90vw);background:#f4f2fb;color:#111;box-shadow:0 20px 60px rgba(0,0,0,.6)}
dialog::backdrop{background:rgba(5,2,20,.6)}
dialog h3{margin:0;padding:12px 18px;background:#3300ff;color:#fff;font-size:16px}
dialog .body{padding:18px;white-space:pre-line;font-size:16px;line-height:1.5}
dialog .acts{display:flex;justify-content:flex-end;gap:10px;padding:0 18px 16px}
dialog .btn{background:#3300ff;font-style:normal;padding:8px 18px}
dialog .btn.sec{background:#fff;color:#111}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

/* ---------- diálogo ---------- */
function dialog(title, body, buttons){
  return new Promise(res=>{
    const d = $('#dlg'); $('#dlg-t').textContent = title; $('#dlg-b').textContent = body;
    const a = $('#dlg-a'); a.innerHTML = '';
    buttons.forEach((t,i)=>{
      const b = document.createElement('button');
      b.className = 'btn' + (i < buttons.length-1 ? ' sec' : ''); b.textContent = t;
      b.onclick = ()=>{ d.close(); res(i); }; a.appendChild(b);
    });
    d.oncancel = ()=>res(-1);
    d.showModal(); a.lastChild.focus();
  });
}

/* ======================================================
   TRES EN RAYA  (port de clases/juegologica.java)
   ====================================================== */
class JuegoLogica {
  constructor(j1,j2){
    this.jugador1 = (j1||'').trim() || 'Jugador 1';
    this.jugador2 = (j2||'').trim() || 'Jugador 2';
    this.limpiarTablero();
  }
  limpiarTablero(){
    this.t = Array.from({length:3},()=>Array(3).fill(''));
    this.turno = 'X'; this.terminado = false;
  }
  marcarCasilla(f,c){
    if(f<0||f>2||c<0||c>2||this.terminado||this.t[f][c]) return false;
    this.t[f][c] = this.turno;
    if(this.verificarEstado() !== 'EN_CURSO') this.terminado = true;
    else this.turno = this.turno==='X' ? 'O' : 'X';
    return true;
  }
  lineaGanadora(){
    const L=[[[0,0],[0,1],[0,2]],[[1,0],[1,1],[1,2]],[[2,0],[2,1],[2,2]],
             [[0,0],[1,0],[2,0]],[[0,1],[1,1],[2,1]],[[0,2],[1,2],[2,2]],
             [[0,0],[1,1],[2,2]],[[0,2],[1,1],[2,0]]];
    return L.find(l=>{const [a,b,c]=l.map(([f,k])=>this.t[f][k]); return a && a===b && b===c;}) || null;
  }
  verificarEstado(){
    const l = this.lineaGanadora();
    if(l) return this.t[l[0][0]][l[0][1]];
    return this.t.some(r=>r.some(x=>!x)) ? 'EN_CURSO' : 'EMPATE';
  }
  nombreGanador(){
    const e = this.verificarEstado();
    return e==='X' ? this.jugador1 : e==='O' ? this.jugador2 : e;
  }
  nombreTurno(){ return this.turno==='X' ? this.jugador1 : this.jugador2; }
}

let ttt, cells = [];
const boardEl = $('#board');
for(let f=0;f<3;f++) for(let c=0;c<3;c++){
  const b = document.createElement('button');
  b.className='cell'; b.setAttribute('aria-label',`Fila ${f+1}, columna ${c+1}`);
  b.onclick = ()=>tttJugar(f,c);
  boardEl.appendChild(b); cells.push(b);
}
function tttRender(){
  for(let f=0;f<3;f++) for(let c=0;c<3;c++){
    const b = cells[f*3+c], v = ttt.t[f][c];
    b.textContent = v; b.className = 'cell' + (v?' '+v:''); b.disabled = !!v || ttt.terminado;
  }
  const w = ttt.lineaGanadora();
  if(w) w.forEach(([f,c])=>cells[f*3+c].classList.add('win'));
}
async function tttJugar(f,c){
  if(!ttt.marcarCasilla(f,c)) return;
  tttRender();
  const e = ttt.verificarEstado();
  if(e==='EN_CURSO'){ $('#estado').textContent = 'Turno de: '+ttt.nombreTurno(); return; }
  const msg = e==='EMPATE' ? '¡Empate!' : 'Ganó: '+ttt.nombreGanador();
  $('#estado').textContent = msg;
  await dialog('Tres en raya', msg, ['OK']);
}
function tttReiniciar(){
  ttt.limpiarTablero(); tttRender();
  $('#estado').textContent = 'Turno de: '+ttt.nombreTurno();
}
$('#ttt-form').onsubmit = e=>{
  e.preventDefault();
  ttt = new JuegoLogica($('#j1').value, $('#j2').value);
  show('ttt-board'); tttReiniciar();
};
$('#ttt-reset').onclick = tttReiniciar;

const later = (fn,ms)=>P.timers.push(setTimeout(fn,ms));
function penalesReset(){
  P.timers.forEach(clearTimeout); P.timers=[]; P.busy=false;
  P.goles=0; P.intentos=0;
  keeperEl.src=IMG.k_cen; keeperEl.className='keeper'; keeperEl.style.transform='';
  ballEl.src=IMG.b_ini; resetBall();
  $('#goles').textContent='Goles: 0'; $('#pint').textContent='Intentos: 0 de 5';
  pmsg.textContent='¡Patea!';
  pBtns.forEach(b=>b.disabled=false);
}
function resetBall(){
  ballEl.style.transition='none';
  ballEl.style.left='50%'; ballEl.style.top='87%';
  ballEl.style.transform='translate(-50%,-50%) scale(1) rotate(0)';
  void ballEl.offsetWidth; ballEl.style.transition='';
}
function patear(lado){
  if(P.busy || P.intentos>=5) return;
  P.busy=true; pBtns.forEach(b=>b.disabled=true);
  const arq = Math.floor(Math.random()*3);
  P.intentos++;
  const gol = lado !== arq; if(gol) P.goles++;
  resetBall();
  ballEl.src = IMG.b_ini;
  const d = P.dest[lado];
  requestAnimationFrame(()=>{
    ballEl.style.left=d.x+'%'; ballEl.style.top=d.y+'%';
    ballEl.style.transform=`translate(-50%,-50%) scale(.62) rotate(${lado===0?-540:lado===2?540:720}deg)`;
    keeperEl.src = P.keeper[arq];
    keeperEl.className = 'keeper' + (arq===1?'':' dive');
    keeperEl.style.transform = `translateX(calc(-50% + ${P.dx[arq]}%))`;
  });
  later(()=>{
    ballEl.src = P.pelota[lado];
    $('#goles').textContent='Goles: '+P.goles;
    $('#pint').textContent=`Intentos: ${P.intentos} de 5`;
    if(P.intentos===5){
      pmsg.textContent=`Fin del juego. Hiciste ${P.goles} goles de 5.`;
    } else {
      pmsg.textContent = gol ? '¡GOOOL!' : '¡Atajó el arquero!';
      later(()=>{ // preparar el siguiente tiro
        keeperEl.src=IMG.k_cen; keeperEl.className='keeper'; keeperEl.style.transform='';
        ballEl.src=IMG.b_ini; resetBall();
        P.busy=false; pBtns.forEach(b=>b.disabled=false);
      },900);
    }
  },560);
}
pBtns.forEach(b=>b.onclick=()=>patear(+b.dataset.kick));
$('#p-reset').onclick = penalesReset;

/* ======================================================
   ADIVINA / WORDLE  (port de Wordleclase.java + wordle.java)
   ====================================================== */
const LETRAS=5, INTENTOS=6;
const PALABRAS = `PERRO LIBRO PLAYA VERDE SILLA PLATO FUEGO TIGRE RADIO CARTA BARCO MUNDO NOCHE PAPEL SALTO TRIGO
CIELO DULCE FLORA HIELO JUEGO LLAVE MANGO NIEVE ABEJA ABRIR ACERO AHORA AMIGO ANCHO ARBOL ARENA
ARROZ AVION BAILE BANCO BARRO BESAR BLUSA BOLSA BORDE BRAZO BRISA BUENO BURRO CABLE CABRA CALOR
CALLE CAMPO CANAL CANTO CARGA CARNE CARRO CAUSA CERCA CHICO CINCO CLASE COBRE COCHE COLOR COMER
CORTE CREAR CRUZA CURVA DANZA DEBIL DENSO DISCO DOLOR DORAR DUDAR DUEÑO ERROR ETAPA FALDA FELIZ
FERIA FIRMA FLACO FORMA FRASE FRUTA FUERA GALLO GANAR GENTE GIRAR GLOBO GOLPE GORDO GRADO GRUPO
HABLA HACER HERIR HOGAR HUESO HUEVO HUMOR JAMAS JOVEN JUNTO JUSTO LABIO LARGO LECHE LEJOS LENTO
LETRA LIBRE LIMON LINDO LISTA LOCAL LUGAR MADRE MAGIA MARCA MARZO MEDIO MENOS METAL MIEDO MISMO
MOTOR MUJER MUSEO NADAR NARIZ NEGRO NIVEL NUEVO NUNCA ORDEN OREJA PADRE PAGAR PALMA PARED PASAR
PATIO PESAR PIANO PINTA PLANO PLATA PLAZA POBRE PODER POLLO PRADO PRIMO PUNTO QUESO QUIEN RATON
REINA RELOJ RESTO RITMO ROBAR RONDA RUEDA RUIDO SABER SACAR SALIR SALSA SALUD SANTO SEÑAL SERIE
SIGLO SIGNO SOBRE SOLAR SUAVE SUELO SUEÑO SUMAR TABLA TALLA TARDE TECHO TENER TERCO TINTA TIRAR
TOMAR TORRE TRAJE TRAER TRIPA TURNO UNION USTED VALOR VENIR VERSO VIAJE VIEJO VISTA VIVIR VUELO
ZORRO GATOS CASAS NUBES MESAS LUNAS VIDEO PIZZA AGUAS ALMAS BOCAS COSAS DEDOS HIJOS HOJAS HORAS
IDEAS ISLAS LADOS LOBOS LUCES MANOS NIÑOS NOTAS OBRAS ROCAS ROPAS ROSAS TAZAS TEMAS TIPOS VASOS
VELAS VIDAS VINOS VOCES VACIO`.split(/\s+/);
const DICC = new Set(PALABRAS);
const STORE='arcade3in1.wordle.stats';

const W = {
  secreta:'', fila:0, col:0, letras:[], busy:false, over:false, teclas:{},
  stats:{partidas:0,victorias:0,racha:0,mejor:0}
};
try{ const s=JSON.parse(localStorage.getItem(STORE)); if(s&&typeof s.partidas==='number') W.stats=s; }catch(_){}
function guardar(){ try{ localStorage.setItem(STORE,JSON.stringify(W.stats)); }catch(_){} }

const normalizar = c => ({'Á':'A','É':'E','Í':'I','Ó':'O','Ú':'U','Ü':'U'}[c=c.toUpperCase()] || c);
const esLetra = c => /^[A-ZÑ]$/.test(c);

function evaluar(palabra){
  const r=Array(LETRAS).fill(0), usada=Array(LETRAS).fill(false), s=W.secreta;
  for(let i=0;i<LETRAS;i++) if(palabra[i]===s[i]){ r[i]=2; usada[i]=true; }
  for(let i=0;i<LETRAS;i++){
    if(r[i]===2) continue;
    for(let j=0;j<LETRAS;j++) if(!usada[j] && palabra[i]===s[j]){ r[i]=1; usada[j]=true; break; }
  }
  return r;
}
const wgrid=$('#wgrid'), wmsg=$('#wmsg'), kbEl=$('#kb');
let tiles=[], rows=[], keyEls={};
(function build(){
  for(let f=0;f<INTENTOS;f++){
    const r=document.createElement('div'); r.className='grow'; rows.push(r);
    const rowT=[];
    for(let c=0;c<LETRAS;c++){ const t=document.createElement('div'); t.className='tile'; r.appendChild(t); rowT.push(t); }
    tiles.push(rowT); wgrid.appendChild(r);
  }
  const layout=['QWERTYUIOP','ASDFGHJKLÑ',['ENTER',...'ZXCVBNM','BORRAR']];
  layout.forEach(l=>{
    const r=document.createElement('div'); r.className='kr';
    [...l].length && (Array.isArray(l)?l:[...l]).forEach(k=>{
      const b=document.createElement('button'); b.className='key'+(k.length>1?' wide':'');
      b.textContent=k; b.dataset.k=k; b.onclick=()=>{tecla(k); b.blur();}; b.tabIndex=-1;
      if(k.length===1) keyEls[k]=b; r.appendChild(b);
    });
    kbEl.appendChild(r);
  });
})();
function wordleInit(){
  W.secreta = PALABRAS[Math.floor(Math.random()*PALABRAS.length)];
  W.fila=0; W.col=0; W.busy=false; W.over=false; W.teclas={};
  W.letras = Array.from({length:INTENTOS},()=>Array(LETRAS).fill(''));
  tiles.flat().forEach(t=>{ t.textContent=''; t.className='tile'; delete t.dataset.s; });
  Object.values(keyEls).forEach(k=>delete k.dataset.s);
  wmsg.textContent='Adivina la palabra';
  $('#w-new').classList.remove('pulse');
}
function tecla(k){
  if(W.busy||W.over) return;
  if(k==='ENTER') return enviar();
  if(k==='BORRAR'){
    if(W.col>0){ W.col--; W.letras[W.fila][W.col]=''; const t=tiles[W.fila][W.col]; t.textContent=''; t.classList.remove('filled'); }
    return;
  }
  if(W.col<LETRAS){
    W.letras[W.fila][W.col]=k; const t=tiles[W.fila][W.col]; t.textContent=k; t.classList.add('filled'); W.col++;
  }
}
function sacudir(){ const r=rows[W.fila]; r.classList.remove('shake'); void r.offsetWidth; r.classList.add('shake'); }
function enviar(){
  if(W.col<LETRAS){ wmsg.textContent='Faltan letras'; sacudir(); return; }
  const palabra=W.letras[W.fila].join('');
  if(!DICC.has(palabra)){ wmsg.textContent='Esa palabra no existe'; sacudir(); return; }
  revelar(palabra, evaluar(palabra));
}
function revelar(palabra,res){
  W.busy=true; let c=0; const f=W.fila;
  const paso=()=>{
    const t=tiles[f][c], i=c;
    t.classList.add('flip');
    setTimeout(()=>{ t.dataset.s=res[i]; pintarTecla(palabra[i],res[i]); },125);
    c++;
    if(c<LETRAS) setTimeout(paso,250);
    else setTimeout(()=>terminarIntento(palabra),520);
  };
  paso();
}
function pintarTecla(l,s){
  const prev = W.teclas[l];
  if(prev===undefined || s>prev){ W.teclas[l]=s; keyEls[l].dataset.s=s; }
}
function terminarIntento(palabra){
  W.busy=false;
  if(palabra===W.secreta){
    wmsg.textContent='¡Ganaste!'; fin(true);
  } else if(W.fila+1>=INTENTOS){
    wmsg.textContent='Perdiste. La palabra era: '+W.secreta; fin(false);
  } else {
    W.fila++; W.col=0; wmsg.textContent=`Intento ${W.fila+1} de ${INTENTOS}`;
  }
}
function fin(gano){
  W.over=true; const s=W.stats; s.partidas++;
  if(gano){ s.victorias++; s.racha++; s.mejor=Math.max(s.mejor,s.racha); } else s.racha=0;
  guardar(); $('#w-new').classList.add('pulse');
}
function estadisticas(){
  const s=W.stats, p=s.partidas?Math.floor(s.victorias*100/s.partidas):0;
  return `Partidas jugadas: ${s.partidas}\nVictorias: ${s.victorias} (${p}%)\nRacha actual: ${s.racha}\nMejor racha: ${s.mejor}`;
}
$('#w-stats').onclick=e=>{e.currentTarget.blur(); dialog('Estadísticas',estadisticas(),['OK']);};
$('#w-new').onclick=e=>{wordleInit(); e.currentTarget.blur();};
document.addEventListener('keydown',e=>{
  if($('#wordle').hidden || $('#dlg').open || e.ctrlKey||e.metaKey||e.altKey) return;
  if(e.key==='Enter'){ if(document.activeElement.tagName==='BUTTON') return; e.preventDefault(); tecla('ENTER'); }
  else if(e.key==='Backspace'){ e.preventDefault(); tecla('BORRAR'); }
  else if(e.key.length===1){ const c=normalizar(e.key); if(esLetra(c)) tecla(c); }
});
</script>
